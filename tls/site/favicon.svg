<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="zoetrope 西洋镜">
	<title>zoetrope · 西洋镜</title>
	<desc>四段环：多视图同处一页；顶部加粗高亮的一段是焦点，其余按三档节流递减。</desc>
	<defs>
		<linearGradient id="zTile" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#18202b"/>
			<stop offset="1" stop-color="#090c11"/>
		</linearGradient>
		<linearGradient id="zFocus" x1="0.15" y1="0" x2="0.85" y2="1">
			<stop offset="0" stop-color="#a8d8ff"/>
			<stop offset="0.5" stop-color="#58a6ff"/>
			<stop offset="1" stop-color="#3b7ad0"/>
		</linearGradient>
		<radialGradient id="zGlow" cx="0.5" cy="0.42" r="0.62">
			<stop offset="0" stop-color="#58a6ff" stop-opacity="0.18"/>
			<stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
		</radialGradient>
	</defs>

	<!-- 底板：深色圆角方，浅色与深色标签页上都立得住 -->
	<rect width="96" height="96" rx="22" fill="url(#zTile)"/>
	<rect width="96" height="96" rx="22" fill="url(#zGlow)"/>
	<rect x="0.9" y="0.9" width="94.2" height="94.2" rx="21.2" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1.8"/>

	<!-- 四段环。上=焦点（加粗、高亮），左右=邻位，下=远端 -->
	<g fill="none" stroke-linecap="round">
		<path d="M35.1 26.6 A25 25 0 0 1 60.9 26.6" stroke="url(#zFocus)" stroke-width="14"/>
		<path d="M69.4 35.1 A25 25 0 0 1 69.4 60.9" stroke="#8fa6c0" stroke-opacity="0.34" stroke-width="11"/>
		<path d="M26.6 60.9 A25 25 0 0 1 26.6 35.1" stroke="#8fa6c0" stroke-opacity="0.34" stroke-width="11"/>
		<path d="M60.9 69.4 A25 25 0 0 1 35.1 69.4" stroke="#8fa6c0" stroke-opacity="0.52" stroke-width="11"/>
	</g>
</svg>
